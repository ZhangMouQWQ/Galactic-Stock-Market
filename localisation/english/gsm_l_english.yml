 edict_gsm_market_watch: "Market Watch"
 edict_gsm_market_watch_desc: "Have the treasury report on the Galactic Securities Exchange every month: the Galactic Composite Index and market sentiment stay in the Situations list of the outliner."
 gsm_market_watch_tt: "Shows the §YGalactic Composite Index§! and market sentiment under §YSituations§! in the outliner; selecting it opens the Situation Log, where 'Open Terminal' opens the financial terminal. Cancelling this edict removes the entry."
