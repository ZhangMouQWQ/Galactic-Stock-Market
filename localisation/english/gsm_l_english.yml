 GSM_HOLD_OPEN_COMPANIES: "Companies >"
 GSM_HOLD_OPEN_COMPANIES_TT: "Review the companies operating on this planet; the owner can restrict industries there."
 decision_gsm_planet_companies: "Companies & Investment"
 decision_gsm_planet_companies_desc: "Review the companies here and set investment and subsidies by industry."
 decision_gsm_planet_companies_effect: "Opens the companies window of this planet."
 gsm_trade_vault: "Securities Account"
 mod_country_resource_max_trade_add: "Trade Storage Capacity"
 gsm_trade_vault_desc: "The Galactic Securities Exchange keeps our Trade in a clearing account: £trade£ Trade storage is raised to 1,000,000,000."
 policy_gsm_policy_defense_outsourcing: "Defense Outsourcing"
 policy_gsm_policy_defense_outsourcing_desc: "Is defense a duty of the state, or a service to be bought? Private contractors come cheap, but their loyalty is to the contract, not to the empire.\n\nContractors supply soldiers and enforcers: weaker, cheaper fleets; Military Contractor and Security Services companies may be founded."
 gsm_dout_off: "In-house Defense"
 gsm_dout_off_name: "$gsm_dout_off$"
 gsm_dout_off_desc: "The forces that defend the empire must answer to the empire alone.\n\nNo Military Contractor or Security Services companies."
 gsm_dout_on: "Outsourced"
 gsm_dout_on_name: "$gsm_dout_on$"
 gsm_dout_on_desc: "Let professionals fight our wars; we only pay the bill.\n\nShip build time §R+50%§!, Ship Upkeep §G-20%§!, Fleet Command Limit and Naval Capacity §R-50%§!, Ship and Army Experience Gain §R-50%§!. Military Contractor and Security Services companies may be founded; they are dissolved at once when this policy ends."
 GSM_DOUT_GESTALT: "Not for gestalt empires"
 policy_gsm_policy_securities_tax: "Securities Tax"
 policy_gsm_policy_securities_tax_desc: "Foreign capital that profits from our companies can be asked to leave something behind.\n\nOur companies' foreign holders pay a withholding tax on dividends and a tax on their gains when they sell, or are paid out in a liquidation or nationalisation. Our own holdings and our private savers are not taxed."
 gsm_stx_none: "Exempt"
 gsm_stx_none_name: "$gsm_stx_none$"
 gsm_stx_none_desc: "Capital should flow freely; we tax companies, not their owners.\n\nNo securities tax."
 gsm_stx_std: "Standard"
 gsm_stx_std_name: "$gsm_stx_std$"
 gsm_stx_std_desc: "Those who profit from our economy share in its upkeep.\n\nForeign holders: §Y10%§! withholding on dividends, §Y10%§! on gains."
 gsm_stx_high: "High"
 gsm_stx_high_name: "$gsm_stx_high$"
 gsm_stx_high_desc: "Our wealth is not for outsiders to carry away.\n\nForeign holders: §Y25%§! withholding on dividends, §Y20%§! on gains."
 policy_gsm_policy_outward_fdi: "Outward Direct Investment"
 policy_gsm_policy_outward_fdi_desc: "Capital that leaves builds other nations.\n\nWhere our companies may invest abroad. The investment regime still decides how much they reinvest."
 gsm_ofdi_regime: "Follow the regime"
 gsm_ofdi_regime_name: "$gsm_ofdi_regime$"
 gsm_ofdi_regime_desc: "Our investment regime decides where companies invest.\n\nState-directed: at home only; guided: abroad up to half of their capital; laissez-faire: anywhere."
 gsm_ofdi_limited: "Limited"
 gsm_ofdi_limited_desc: "Some of their capital may go abroad, most of it stays.\n\nWithin what the investment regime allows, foreign capital is at most §Y25%§! of a company's capital: state-directed companies still invest at home only, and a foreign site must beat the best home site by about an eighth of the return (§Y0.08%§!/month for a §Y0.64%§! return) after tax."
 gsm_ofdi_limited_name: "$gsm_ofdi_limited$"
 gsm_ofdi_forbidden: "Forbidden"
 gsm_ofdi_forbidden_name: "$gsm_ofdi_forbidden$"
 gsm_ofdi_forbidden_desc: "Our capital serves our people.\n\nCompanies invest at home only; branches abroad stay."
 policy_gsm_policy_antitrust: "Antitrust"
 policy_gsm_policy_antitrust_desc: "No company should hold a market in its hand.\n\nThe largest share of an industry in our state that a merger of two of our companies may reach."
 gsm_at_standard: "Standard"
 gsm_at_standard_name: "$gsm_at_standard$"
 gsm_at_standard_desc: "Concentration is watched, not forbidden.\n\nMergers up to §Y50%§! of the industry."
 gsm_at_lax: "Lax"
 gsm_at_lax_name: "$gsm_at_lax$"
 gsm_at_lax_desc: "Champions win wars.\n\nMergers up to §Y70%§! of the industry."
 gsm_at_strict: "Strict"
 gsm_at_strict_name: "$gsm_at_strict$"
 gsm_at_strict_desc: "Many sellers keep prices honest.\n\nMergers up to §Y35%§! of the industry."
 policy_gsm_policy_invest_pace: "Corporate Investment Pace"
 policy_gsm_policy_invest_pace_desc: "Wealth that outgrows the treasury ends in a deficit.\n\nHow far companies may expand the jobs on our planets: whether their upkeep must fit within our monthly resource income and a measured draw on our stockpiles."
 gsm_ip_prudent: "Prudent Investment"
 gsm_ip_prudent_name: "$gsm_ip_prudent$"
 gsm_ip_prudent_desc: "Before companies add jobs, their upkeep must fit within our monthly income of each resource plus 1/24 of its stockpile; the excess waits."
 gsm_ip_free: "Free Investment"
 gsm_ip_free_name: "$gsm_ip_free$"
 gsm_ip_free_desc: "Companies expand as their funds and labour allow, regardless of our resource balance."
 policy_gsm_policy_new_colony_invest: "New Colony Investment"
 policy_gsm_policy_new_colony_invest_desc: "A young colony is easiest to steer before its first foundry stands.\n\nOnly colonies founded from now on; existing ones are unchanged. Under Restricted, every industry there starts Barred until we open it in the planet's company window; Laissez-faire ignores this. No cooldown on the Financial Terminal's regulation page; the usual one here."
 gsm_nci_open: "Open Investment"
 gsm_nci_open_name: "$gsm_nci_open$"
 gsm_nci_open_desc: "On colonies founded from now on, every industry starts open. Existing colonies are unaffected."
 gsm_nci_restrict: "Restricted Investment"
 gsm_nci_restrict_name: "$gsm_nci_restrict$"
 gsm_nci_restrict_desc: "On colonies founded from now on, every industry starts Barred: no company invests there until we open industries one by one in the planet's company window. Existing colonies are unaffected."
 gsm_review.1.name: "Foreign Investment Project"
 gsm_review.1.desc: "§Y[From.GetRealName]§!, a foreign company, wants to invest in [FromFrom.GetName]: §W[Root.gsm_d_fp_u]§! job units of new capacity. Its jobs would serve our planet, its profit there would pay our corporate tax, and the capital would answer to another state.\n\nIf we do not object within 30 days, the project goes ahead."
 gsm_review.1.a: "Approve the investment"
 gsm_review.1.b: "Reject it (no new request from this company there for 5 years)"
 GSM_NEWS_MSG_15: "§Y[event_target:gsm_news_1.GetRealName]§! was dissolved: its home state does not outsource defense."
 GSM_NEWS_MSG_16: "§Y[event_target:gsm_news_1.GetRealName]§! was placed under a §Yrisk warning§! (ST): it is insolvent. Unless it recovers within three years, it will be delisted."
 GSM_NEWS_MSG_17: "§Y[event_target:gsm_news_1.GetRealName]§! was delisted after three years under a risk warning. Its holders still receive dividends, but its shares can no longer be sold; only its home state may still buy."
 GSM_NEWS_MSG_18: "§Y[event_target:gsm_news_1.GetRealName]§! was dissolved by a resolution of its shareholders: its assets were sold off in good order and the proceeds paid out."
 GSM_NEWS_MSG_20: "§Y[event_target:gsm_news_1.GetName]§! came under Galactic Community economic sanctions: its companies count as riskier, Community members outside the sanctions may not buy their shares, and they open no new branches in member states."
 gsm_merger.1.name: "Takeover Offer"
 gsm_merger.1.desc: "§Y[FromFrom.GetRealName]§! offers to absorb §Y[From.GetRealName]§!, which we control, at £trade£§W[From.gsm_d_off_ps]§! a share. If we accept, its cash, earnings and the branches the acquirer may operate pass to the acquirer, the other branches are sold at half their capital, and its shareholders are paid out or receive the acquirer's shares. The price is checked again on acceptance; below this one (cut pro rata by any dividend paid meanwhile) the offer lapses. The offer lapses in 30 days."
 gsm_merger.1.a: "Accept the offer"
 gsm_merger.1.b: "Reject it"
 GSM_NEWS_MSG_21: "§Y[event_target:gsm_news_1.GetRealName]§! was absorbed in a merger: its cash and the branches the acquirer may operate passed to the acquirer, its shareholders were paid out or received the acquirer's shares."
 GSM_NEWS_MSG_22: "§Y[event_target:gsm_news_1.GetRealName]§! was spun off: the branches of the original company in one state now form a company of their own, owned by its shareholders."
 GSM_NEWS_MSG_19: "§Y[event_target:gsm_news_1.GetRealName]§! bought back shares from the public float and retired them: each remaining share owns more of the company."
 GSM_NEWS_MSG_23: "§Y[event_target:gsm_news_1.GetRealName]§! was formed as a holding group: its founding state passed its stakes in the member companies to the group in exchange for all of the group's shares."
 GSM_NEWS_MSG_24: "§Y[event_target:gsm_news_1.GetRealName]§! was founded by its group, which owns all of its shares."
 GSM_NEWS_MSG_25: "§Y[event_target:gsm_news_1.GetRealName]§! was in restructuring and was rescued by its group in exchange for new shares."
 GSM_NEWS_MSG_26: "§Y[event_target:gsm_news_1.GetRealName]§! was dissolved: its member shares went to its shareholders in proportion, its cash was paid out."
 GSM_NEWS_MSG_27: "§Y[event_target:gsm_news_1.GetRealName]§! lost its headquarters world and had no other site to move to. It was wound up and its remaining assets were paid out to the shareholders."
 GSM_NEWS_MSG_28: "§Y[event_target:gsm_news_1.GetRealName]§! is now subsidised by its controlling holder: its treasury covers the company's losses every month, and the company sheds no branches, pays no special dividend and buys back no shares while the subsidy lasts."
 GSM_NEWS_MSG_29: "The subsidy of §Y[event_target:gsm_news_1.GetRealName]§! has ended: its controlling holder stopped it, lost control or could no longer cover the losses. What was left in its investment pool went back to the payer."
 GSM_NEWS_MSG_30: "§Y[event_target:gsm_news_1.GetRealName]§! is insolvent and has entered restructuring: it pays no dividends and borrows nothing, invests only where it is sure to earn, may sell branches, raise capital or swap its debt for equity, and its home state decides on a rescue."
 GSM_NEWS_MSG_31: "§Y[event_target:gsm_news_1.GetRealName]§! completed its restructuring. For a year of recovery it pays half its usual dividend and takes no new bonds."
 GSM_TERMINAL_ENTRY: "Financial Terminal"
 gsm_market_sit: "GCI [event_target:gsm_exchange.gsm_d_index] [This.GetGsmSitChg1m]"
 gsm_market_sit_type: "Galactic Composite Index"
 gsm_market_sit_desc: "The composite index of every listed security on the Galactic Securities Exchange, base 1000, dividends included.\n\n1 month [This.GetGsmSitChg1m] | 12 months [This.GetGsmSitChg12m]\nSentiment §W[event_target:gsm_exchange.gsm_d_sent]%§! | [This.GetGsmSitRegime]\n\nThe bar is market sentiment, updated after each monthly settlement: below 94% it is depressed, above 106% buoyant. Choose 'Open Terminal' to call up the markets. Cancel the edict 'Market Watch' to remove this entry."
 gsm_market_sit_monthly_change_tooltip: "Progress is market sentiment, set by the exchange at each monthly settlement."
 gsm_market_sit_end_tt: "Market sentiment always stays between 60% and 150%."
 gsm_sit_st_low: "Depressed Sentiment"
 gsm_sit_st_low_desc: "Market sentiment below 94%: investors are gloomy and share prices are under pressure."
 gsm_sit_st_mid: "Steady Sentiment"
 gsm_sit_st_mid_desc: "Market sentiment between 94% and 106%."
 gsm_sit_st_high: "Buoyant Sentiment"
 gsm_sit_st_high_desc: "Market sentiment above 106%: investors are confident and share prices are lifted."
 gsm_sit_ap_watch: "Watch"
 gsm_sit_ap_watch_desc: "Let the market rise and fall."
 gsm_sit_ap_watch_tt: "Takes no action."
 gsm_sit_ap_term: "Open Terminal"
 gsm_sit_ap_term_desc: "Call up the Galactic Securities Exchange terminal: markets, portfolio, corporate directory, corporate management and regulation."
 gsm_sit_ap_term_tt: "Opens the financial terminal, then returns to §YWatch§!."
