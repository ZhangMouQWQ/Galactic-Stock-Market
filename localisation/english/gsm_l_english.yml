 decision_gsm_open_terminal: "Open Financial Terminal"
 decision_gsm_open_terminal_desc: "Call up the Galactic Securities Exchange terminal: markets, portfolio, corporate directory, corporate management and regulation."
 decision_gsm_encourage_investment: "Encourage Corporate Investment"
 decision_gsm_encourage_investment_desc: "We send the corporate world a clear signal: this planet welcomes capital.\n\nCompanies favour this planet when they choose where to invest."
 decision_gsm_encourage_investment_effect: "Companies prefer to invest on this planet."
 decision_gsm_restrict_investment: "Restrict Corporate Investment"
 decision_gsm_restrict_investment_desc: "This planet no longer welcomes new corporate capital.\n\nCompanies may not build or expand assets on this planet. Existing assets keep operating."
 decision_gsm_restrict_investment_effect: "Companies can no longer invest on this planet."
 decision_gsm_neutral_investment: "Lift Corporate Investment Rules"
 decision_gsm_neutral_investment_desc: "Withdraw all investment guidance for this planet and let companies judge for themselves."
 decision_gsm_neutral_investment_effect: "Removes planet-specific investment rules."
 policy_gsm_policy_corporate_tax: "Corporate Taxation"
 policy_gsm_policy_corporate_tax_desc: "Our corporations profit from the order and the markets the state provides, and the state is owed its share. Tax too little and the treasury runs dry; tax too much and capital loses its nerve.\n\nCompanies pay a share of their operating profit every month, in £trade£ Trade."
 gsm_tax_standard: "Standard Corporate Tax"
 gsm_tax_standard_name: "$gsm_tax_standard$"
 gsm_tax_standard_desc: "The state takes its due and capital keeps its incentive: an arrangement both can live with.\n\nCompanies pay §Y20%§! of their operating profit."
 gsm_tax_low: "Low Corporate Tax"
 gsm_tax_low_name: "$gsm_tax_low$"
 gsm_tax_low_desc: "Light taxes leave profits where they were made, and investors reward us for it.\n\nCompanies pay §Y10%§! of their operating profit. Higher after-tax earnings support share prices."
 gsm_tax_high: "High Corporate Tax"
 gsm_tax_high_name: "$gsm_tax_high$"
 gsm_tax_high_desc: "Corporate fortunes are built on the infrastructure and the peace the state provides. They can afford to pay for both.\n\nCompanies pay §Y35%§! of their operating profit."
 policy_gsm_policy_foreign_capital: "Foreign Capital"
 policy_gsm_policy_foreign_capital_desc: "Foreign money brings capital and confidence, but it can also put our corporations into other hands. We must decide how far our markets open.\n\nWhether foreign empires may buy shares of our companies."
 gsm_fc_restricted: "Restricted Foreign Capital"
 gsm_fc_restricted_name: "$gsm_fc_restricted$"
 gsm_fc_restricted_desc: "Foreign capital is welcome, as long as control stays at home.\n\nForeign investors may hold at most §Y25%§! of each domestic company."
 gsm_fc_open: "Open Capital Markets"
 gsm_fc_open_name: "$gsm_fc_open$"
 gsm_fc_open_desc: "Capital knows no borders: whoever pays the most may own the most.\n\nForeign investors may buy any amount of our listed companies. A foreign empire holding over half of a company controls it and may inject capital or buy back shares; with two thirds it may even dissolve the company."
 gsm_fc_closed: "Closed Capital Markets"
 gsm_fc_closed_name: "$gsm_fc_closed$"
 gsm_fc_closed_desc: "Our corporations belong to our people. Foreigners have no claim on them.\n\nForeign investors may not buy shares of our companies."
 policy_gsm_policy_investment_regime: "Corporate Investment Regime"
 policy_gsm_policy_investment_regime_desc: "Should profits fund expansion or reward shareholders? Should our corporations dig in at home or reach across the galaxy? The investment regime decides where capital flows.\n\nHow companies split profits between reinvestment and dividends, and where they invest."
 gsm_ir_guided: "Guided Investment"
 gsm_ir_guided_name: "$gsm_ir_guided$"
 gsm_ir_guided_desc: "The state points capital in the right direction without taking the wheel.\n\nCompanies reinvest §Y60%§! of spare cash and pay out §Y40%§! of profit. They invest at home and abroad: foreign capital stays at most half of their capital, and a foreign site must beat the best home site by about an eighth of the return (§Y0.08%§!/month for a §Y0.64%§! return) after tax."
 gsm_ir_laissez_faire: "Laissez-faire"
 gsm_ir_laissez_faire_name: "$gsm_ir_laissez_faire$"
 gsm_ir_laissez_faire_desc: "The market finds the best use of capital on its own; the state keeps out of the way.\n\nCompanies reinvest §Y80%§! of spare cash and pay out §Y50%§! of profit. They weigh the whole galaxy: home and foreign sites compete on after-tax return alone. We cannot restrict industries on our planets."
 gsm_ir_directed: "State-directed Investment"
 gsm_ir_directed_name: "$gsm_ir_directed$"
 gsm_ir_directed_desc: "Capital must serve the grand designs of the state, not the purses of shareholders.\n\nCompanies pay out §Y25%§! of profit and reinvest §Y70%§! of spare cash. They invest at home only."
 policy_gsm_policy_bailout: "Corporate Bailouts"
 policy_gsm_policy_bailout_desc: "When a corporation stands at the brink, does the state step in or let the market clear? Every rescue tests the treasury, and the discipline of the market.\n\nWhat the state does when a domestic company becomes insolvent and enters restructuring."
 gsm_bo_case_by_case: "Case by Case"
 gsm_bo_case_by_case_name: "$gsm_bo_case_by_case$"
 gsm_bo_case_by_case_desc: "We save what is worth saving, and only that.\n\nEvery company that enters restructuring is brought before us: rescue it, nationalise it, arrange rescue financing or swap its debt for equity. The case returns every year, and the company page can raise it at any time."
 gsm_bo_never: "No Bailouts"
 gsm_bo_never_name: "$gsm_bo_never$"
 gsm_bo_never_desc: "Market discipline must not be undermined. The treasury does not pay for failure.\n\nCompanies in restructuring get neither a bailout nor rescue financing. They must save themselves: by selling branches, with new capital from their holders or their holding group, by swapping debt for equity, or in a takeover."
 gsm_bo_always: "Too Big to Fail"
 gsm_bo_always_name: "$gsm_bo_always$"
 gsm_bo_always_desc: "Some corporations are simply too big to fail.\n\nCompanies in restructuring are rescued: by the treasury when it can afford it, otherwise by rescue financing from private savings. A rescued company gets neither again for ten years."
 policy_gsm_policy_subsidies: "Corporate Subsidies"
 policy_gsm_policy_subsidies_desc: "Some industries serve the public good yet rarely turn a profit. Should the state carry them?\n\nWhich industries our planets subsidise by default. While the treasury can pay, every branch of a subsidised industry on such a planet, foreign companies' too, has its loss after its share of overhead covered and keeps its jobs, and 0.25% of its capital a month goes into the planet's investment pool for that industry. Each planet can be set apart in its planet companies window."
 gsm_sub_none: "No Subsidies"
 gsm_sub_none_name: "$gsm_sub_none$"
 gsm_sub_none_desc: "Companies must stand on their own. The treasury is not a charity.\n\nInsolvent companies enter restructuring and must save themselves or be rescued."
 gsm_sub_public: "Public Services"
 gsm_sub_public_name: "$gsm_sub_public$"
 gsm_sub_public_desc: "Media, healthcare and housing are pillars of society, not something to let wither.\n\nWhile the treasury can pay, the media, healthcare and construction branches on our planets, and under defense outsourcing also the Military Contractor and Security Services branches, have their losses covered and keep their jobs, and 0.25% of their capital a month goes into the planet's investment pool for their industry. Each planet can be set apart."
 gsm_sub_all: "All Industries"
 gsm_sub_all_name: "$gsm_sub_all$"
 gsm_sub_all_desc: "Every job on our worlds is a national asset. None may stand empty.\n\nWhile the treasury can pay, the branches of every industry on our planets have their losses covered and keep their jobs, and 0.25% of their capital a month goes into the planet's investment pool for their industry. Each planet can be set apart."
 policy_gsm_policy_fdi: "Foreign Direct Investment"
 policy_gsm_policy_fdi_desc: "Foreign companies bring capital and jobs, and send their profits home. Whom do we allow to invest on our worlds?\n\nWhich foreign companies may build branches on our planets. Closing the door stops new investment; existing branches stay."
 gsm_fdi_pact: "Commercial Pacts Only"
 gsm_fdi_pact_name: "$gsm_fdi_pact$"
 gsm_fdi_pact_desc: "We do business with partners we trust.\n\nCompanies from empires that have a commercial pact with us may invest here."
 gsm_fdi_open: "Open"
 gsm_fdi_open_name: "$gsm_fdi_open$"
 gsm_fdi_open_desc: "Our worlds are open to capital from across the galaxy.\n\nCompanies from every empire we have contact and peace with may invest here."
 gsm_fdi_forbidden: "Forbidden"
 gsm_fdi_forbidden_name: "$gsm_fdi_forbidden$"
 gsm_fdi_forbidden_desc: "Our worlds serve our own corporations, no one else.\n\nNo foreign company may build new branches here."
 GSM_FDI_GESTALT: "Not for gestalt empires"
 gsm_company.50.name: "Financial Crisis: [From.GetRealName]"
 gsm_company.50.desc: "An urgent report from the treasury: §Y[From.GetRealName]§! is insolvent and has entered restructuring.\n\nCash: £trade£[From.gsm_d_cash]   Capital: £trade£[From.gsm_d_k]   Share price: £trade£[From.gsm_d_price]\n\nA bailout would cost £trade£[From.gsm_d_bail], in exchange for newly issued shares at a discount. Nationalising it at a discount and recapitalising it would cost £trade£[From.gsm_d_natcost] plus the bailout. If we hold back, the company works its own way out, selling branches and investing only where it is sure to earn; the matter comes before us again in a year."
 gsm_company.50.a: "Bail it out"
 gsm_company.50.a.tooltip: "Pays its debts plus a buffer. We receive new shares at half the market price, at least 90% of the operating value per share; existing shareholders are diluted."
 gsm_company.50.b: "Nationalise it"
 gsm_company.50.b.tooltip: "Buys out all other shareholders at §Y30%§! of the market price, then recapitalises the company."
 gsm_company.50.e: "Rescue financing"
 gsm_company.50.e.tooltip: "Our private savings put up £trade£[From.gsm_d_bail] for new shares at half the market price (at least 90% of the operating value per share); the treasury pays nothing. The new shares go to domestic savers, and existing shareholders, us included, are heavily diluted."
 gsm_company.50.f: "Swap its debt for equity"
 gsm_company.50.f.tooltip: "The bonds our private savings lent it become new shares at a discount, owned by domestic savers. The treasury pays nothing, the company is free of that debt, and existing shareholders are diluted."
 gsm_company.50.d: "We will decide later"
 gsm_company.50.d.tooltip: "Nothing happens for now. The company stays in restructuring and the matter comes before us again in a year; its company page can raise it at any time."
