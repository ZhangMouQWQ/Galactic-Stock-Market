 GSM_WZ_LOWLAB: "§YReady to found§!: the headquarters has no free labour or its market is full now; the new jobs may stay empty for a while and early earnings will be low."
 GSM_WZ_BLOCKED: "§RCannot found this company now§! - check corporate capacity, the headquarters (must be our unoccupied colony), resource access for the industry and our £trade£ Trade stockpile."
 gsm_ui.7.desc: "§HThe Galactic Securities Exchange§!\n\nAmong the stars, wealth flows not only from mines and foundries but from confidence and expectation. The Galactic Securities Exchange lets the corporations of every empire raise capital and compete in the open, and lets shrewd investors profit from both.\n\n§YCompanies§! are founded by empires (Management > Found a new company). Each belongs to one industry and has a headquarters planet and a home state: the empire that owns the headquarters. How many companies an empire can run grows with its £pop£ population. AI empires found research companies first, then the industries that supply research, and never political consulting companies.\n\n§YCorporate branches§! appear in a planet's Holdings tab, in the Galactic Securities Exchange row: one building per industry operating there, carrying the £job£ jobs it created (Construction builds £housing£ housing instead). The Companies button in that tab, or the planet decision, lists every company on the planet; the planet's owner can also restrict single industries there (not under Laissez-faire); the New Colony Investment policy decides whether colonies founded later start with every industry restricted. The owner decides the jobs' local flavour. Income depends on how many of those jobs are filled and what they are worth locally: £amenities£ amenities and housing pay more where they are short, rulers where the labour market is balanced. Companies add no jobs of a type while that type still has vacancies on the planet.\n\n§YFinances§! are settled monthly. Revenue = filled jobs × output, valued at market prices in £trade£ Trade, or at fixed shadow prices for £unity£ unity, research, amenities and housing. The pop growth and assembly that healthcare companies bring is valued at a fixed price per pop. It pays in full while free housing is at least a tenth of the population, less as housing fills, and becomes a loss where housing falls short. Costs are job upkeep, operations, depreciation and overhead; the home state collects corporate tax in Trade. Each company's taxable profit first loses a headquarters allowance, and a newly founded company pays no home tax for its first two years. Every quarter companies pay their regular dividend in Trade, then invest one round:\n- growth of existing branches and new sites are ranked together by the expected after-tax return of one more job unit, from the planet's real job output (buildings, technologies, traditions and the secondary outputs of refinery buildings count); each planet takes a few units from a company per quarter at most, and the rest of the money moves down the list to the next planet until no site is worth it. The return table covers every colony of the home state;\n- a branch grows only with its jobs at least §Y85%§! filled, at most doubling a round;\n- after the round, half of the cash above the reserve, 15% of capital, debts, the last year's investment and the reinvestment funds is paid as a special dividend, at most the distributable profit. Money from selling branches is kept as reinvestment funds and goes into investment first, for two years.\nWhere they may go depends on the home state's investment regime: state-directed invests at home only; guided also abroad, but foreign capital stays at most half and a foreign site must beat the best home site by about an eighth of the return (§Y0.08%§!/month for a §Y0.64%§! return); laissez-faire weighs the whole galaxy. The Outward Direct Investment policy can further cap foreign capital at a quarter of a company's capital, within what the regime allows, or forbid investing abroad. Abroad means empires whose foreign direct investment policy admits them (open, or commercial-pact partners only) while both states are in contact and at peace. Profit made abroad is taxed by the host, and while host and home are at war those branches earn nothing.\n\n§YMarket capacity§!: corporate jobs on a planet are limited to half its housing. Once half of that is used, new jobs earn less and less, and the jobs already there earn less on average; none are sold for it. Housing built by construction companies adds capacity, and every job unit pays them a monthly capacity fee for the share they provide. Their rent falls where a planet's housing exceeds twice its population and turns into a loss beyond three times; the capacity fees count in full. Each company adds at most a few job units on a planet per quarter, set by the planet's building capacity; the rest of its money goes to the next planet. The planet companies window shows each planet's capacity, fee and limit.\n\n§YShare prices§! follow the operating value (book value and earnings) times a market part: market sentiment, sector conditions, company risk (war, restructuring, an occupied headquarters), the company's own news, the net buying of the last three months and the trend of the last half year. The market part stays within 0.4x to 2.5x and each of its parts returns to normal, so in the long run operations set the price. Prices move gradually with some noise, through bull and bear markets.\n\n§YTrading§! is by share count: on the order ticket beside every company page, choose Buy or Sell and the number of shares; it shows the most you can buy or sell, the estimated fill price, the amount and the fee. The public float is the counterparty; every trade moves the price and pays a §Y1%§! fee. Foreign purchases follow the home state's Foreign Capital policy. Limit orders are matched at the monthly close: a buy fills when the close is at or below its limit, a sell when it is at or above; an order lasts up to 12 months, at most 5 per empire.\n\n§YNeutral companies§! (Galactic Exploration Company, Galactic Futures Exchange, Interstellar Arms Consortium, Galactic Insurance Group, Stardust Quantum, Jarzz's Launch Pad) have no home state: their prices follow the galaxy (expansion, trading, wars) or pure hype, and every year they grow with the wealth of the galaxy's empires. On their Leverage tab you trade CFDs by share count: buying goes long and selling goes short, one net position per company, at 2x, 5x or 10x (Jarzz's Launch Pad: up to 30x), up to twice the market cap; the margin, the notional divided by the leverage, is taken from your Trade. Fees and monthly funding apply; at the monthly settlement a long is valued at the month's low and a short at its high, and a position whose equity then falls below a quarter of its margin is liquidated. You never lose more than the margin. A close of your own takes only the shares whose payout fits your Trade storage; what a liquidation pays beyond it is owed and paid in month by month as room allows. A company's market cap is at most 100 billion: a price at that cap is marked [[Price at its cap] on its page.\n\n§YDefense outsourcing§! is a policy closed to gestalt empires: ship build time §R+50%§!, Ship Upkeep §G-20%§!, Fleet Command Limit and Naval Capacity §R-50%§!, Ship and Army Experience Gain §R-50%§!. While it lasts, Military Contractors (soldiers) and Security Services (enforcers) may be founded; ending it dissolves them at once.\n\n§YCorporate actions§!: the controlling holder (more than half of the shares) can inject capital, buy back shares, and merge with companies of the same industry; a home state that also holds control can issue new shares (an IPO for unlisted companies); holders of two thirds can dissolve a solvent company by resolution. The home state can nationalise companies, and may still dissolve one in the ten years after, but recovers only the liquidation value. Losses never close a company: it is wound up only when it has no assets left and its cash and investment pool cannot buy a single unit. A company without assets but with the money is §Ydormant§! and must invest. An insolvent company enters §Rrestructuring§!: no dividends and no new bonds, investment only where the return is safe; it may sell branches, be taken over within its industry, take capital from its holders, a treasury bailout, rescue financing from private savings or a debt-for-equity swap, as the Bailouts policy decides (under case by case each one comes before us). Once it has turned around it recovers for a year and returns to normal; it is never liquidated. An insolvent company is also put under a §Rrisk warning§!: its price moves at most 10% a month; after three years a listed one is delisted, and an unlisted one stays under the warning. Hive minds run Broods and machine intelligences run Subroutines: always state-owned, never listed. The exchange register has 200 seats; each company and each holding group takes one. When founding, pick a name from the name pool on the confirmation step, or type any name as your capital's name. The home state, or an empire holding more than half of the shares, can rename a company on its Rename tab.\n\n§YCompany subsidies§!: the controlling holder can subsidise a company on its Actions tab. Its treasury then covers the company's losses every month, and may pay 0.5% or 1% of the capital more into the company's investment pool, which can only be invested. A subsidised company never cuts back its branches and never enters restructuring, but pays no special dividend and buys back no shares; the subsidy ends when the treasury falls short or control changes hands, and the pool goes back to the payer. The Subsidies policy sets which industries our planets subsidise by default: the planet's owner first covers the losses of those branches there, and the rest goes into the planet's industry investment pool for the companies investing there. Those branches never cut back either; a planet subsidy the owner fails to pay in full for three months in a row ends. The owner's job limits still apply. A company with both subsidies expands faster on that planet.\n\n§YHolding groups§!: a non-gestalt empire can form one holding group (Management > Form a group) from at least two domestic companies it holds more than half of; its stakes pass to the group in exchange for all of the group's shares. The group's controlling holder founds subsidiaries from the group's cash and switches the rescue and the support of members; it also controls every member the group holds more than half of. See the group pages.\n\n§YCharts§!: candlesticks show the open, high, low and close of each month, quarter or year. History is kept for 20 months, 20 quarters and 20 years; All picks the period from the company's age, up to 5 years a candle."
