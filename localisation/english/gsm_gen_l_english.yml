 GSM_S_REGNOTE_2: "How regulation works"
 gsm_ui.8.desc: "The cards are regular policies, also found in the Policies screen. A change made here starts the usual cooldown and locks the policy for 10 years.\n\n§WForeign capital§!: whether foreign empires may buy our companies (restricted: at most 25% of each). Under \"open\" a foreign empire may buy control of a company on the market: the only way to a hostile takeover.\n\n§WForeign direct investment§!: which foreign companies may open branches here; they pay our tax on the profit made here.\n\n§WOutward direct investment§!: where our companies may invest abroad: as the investment regime says; limited to a quarter of their capital within what the regime allows (state-directed still invests at home only, and a foreign site must beat the best home site by about an eighth of the return, 0.08%/month for a 0.64% return); or not at all (branches abroad stay).\n\n§WSecurities tax§!: what foreign holders of our companies pay on dividends and gains."
