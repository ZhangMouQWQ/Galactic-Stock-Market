 gsm_ui.30.desc: "[Root.GetGsmPcHc]Restricted industries make no new investment here; companies already here keep operating (no industry restrictions under Laissez-faire; the whole planet can still be restricted). Subsidised industries: you cover the losses of every branch here, foreign ones too, and fund the planet's investment pool. Only the planet's owner.\n\n§YMarket capacity§!: corporate jobs on a planet are limited to half its housing. Once half of that is used, new jobs earn less and less, and the jobs already here earn less on average; none are sold for it. Housing built by construction companies adds capacity, and every job unit pays them a monthly capacity fee for the share they provide. Each company adds at most a few job units here per quarter, set by the planet's building capacity; the rest of its money goes to the next planet.\n\n§YHealthcare§!: the healthcare companies may run on a planet is limited by the housing not built by companies (its highest over the last year) and by the planet's size, with room for at least two units. Only with our own subsidy here (yellow) do companies go beyond it: the planet's investment pool pays for the extra, we bear its running costs, and the companies gain nothing from it. Otherwise healthcare beyond the room earns nothing and part of it is sold each quarter; a company's last unit at its headquarters stays."
