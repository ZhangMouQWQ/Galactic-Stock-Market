 GSM_S_REGNOTE_1: "How regulation works"
 gsm_ui.5.desc: "The cards are regular policies, also found in the Policies screen. A change made here starts the usual cooldown and locks the policy for 10 years, except New colonies, which changes here at any time.\n\n§WCorporate tax§!: the share of operating profit companies pay the state every month, in £trade£ Trade.\n\n§WInvestment regime§!: how companies split profit between reinvestment and dividends, and where they invest: state-directed at home only, guided also abroad (foreign capital at most half), laissez-faire across the galaxy.\n\n§WBailouts§!: what the state does when an insolvent company is in restructuring; under case by case, every case is brought before us.\n\n§WSubsidies§!: the default for our planets; the planet companies window sets each planet apart. While the treasury can pay, we cover the loss of every branch of a subsidised industry there after its share of overhead, foreign ones too, and put 0.25% of its capital a month into the planet's investment pool for that industry, which pays up to half of each new investment in it there (at most 2% of the capital a month in all). Those branches keep their jobs, and companies invest there even at a small expected loss.\n\n§WDefense outsourcing§!: weaker, cheaper fleets; Military Contractor and Security Services companies exist only while it lasts and are dissolved when it ends.\n\n§WAntitrust§!: the largest share of an industry here that a merger of two of our companies may reach.\n\n§WInvestment pace§!: under prudent investment, companies add jobs on our planets only while the upkeep of the new jobs fits within our monthly income of each resource plus 1/24 of its stockpile; free investment ignores our balance. Companies already operating are never cut back.\n\n§WNew colonies§!: only colonies founded from now on, existing ones are unchanged: whether they start open to companies or with every industry barred, to be opened one by one in the planet companies window. Restrictions do nothing under Laissez-faire. No lock here; in the Policies screen the usual cooldown applies."
