 gsm_ui.25.desc: "[Root.GetGsmCurMissing]The group's §Wcontrolling holder§! (more than half of its shares) founds wholly owned subsidiaries in industries no member runs, paid from the group's cash (it keeps £trade£1000), and switches the rescue of members in restructuring and the purchases that support members priced below their value. It also controls every member the group holds more than half of.\n\nThe §Whome state§!, while it controls the group, lists it or issues new shares to its private savings.\n\nHolders of §Wtwo thirds§! may dissolve the group: its member shares go to them in kind, its cash is paid out."
 GSM_S_GFORM: "Form a holding group"
 GSM_GF_HELP: "Our whole holding in each chosen company passes to the group; we receive all of the group's shares. Companies we hold more than half of, at home, not in restructuring or under a risk warning, not nationalised in the last 10 years and never expropriated."
