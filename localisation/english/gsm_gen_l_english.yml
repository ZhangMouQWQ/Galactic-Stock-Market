 gsm_ui.15.desc: "§W1.§! Click §WStart renaming§!: your capital's current name is kept aside.\n§W2.§! Open the planet §W[gsm_ren_pl.GetName]§! in the planet view, click its name and type the company's new name. The terminal can stay open.\n§W3.§! Click §WApply the new name§!: the company takes it and the planet gets its old name back.\n§vCancel restores the planet's name without changing the company. While a rename is pending, the launcher opens this page.§!"
