 gsm_ui.3.desc: "$GSM_STATUS_LISTED$ traded on the exchange; anyone may buy the public float.\n$GSM_STATUS_PRIVATE$ owned by its home state (and private savings); not traded.\n$GSM_STATUS_BROOD$ / $GSM_STATUS_SUBROUTINE$ a gestalt empire's state entity; never traded.\n$GSM_STATUS_NEUTRAL$ no home state; every empire may trade it, CFDs on its Leverage tab.\n$GSM_STATUS_CSUB$ subsidised by its controlling holder.\n$GSM_STATUS_ST$ / $GSM_STATUS_LOSS$ risk warning for insolvency: after three years a listed company is delisted ($GSM_STATUS_DELIST$ in its last months), an unlisted one stays under the warning.\n$GSM_STATUS_DISTRESS$ insolvent and restructuring: it may sell branches, take capital or a rescue.\n$GSM_STATUS_RECOVERY$ a year of recovery after restructuring.\n$GSM_STATUS_SHELL$ no assets but money: it must invest, and is wound up once its funds cannot buy one unit.\n$GSM_STATUS_DEFUNCT$ wound up or dissolved; kept for the record.\n\n§vSort, filter and sector buttons narrow the list; [Root.gsm_ui_nres] companies match.§!"
