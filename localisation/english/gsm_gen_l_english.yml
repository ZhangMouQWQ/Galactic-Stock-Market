 GSM_CSUB_L: "Company subsidy: the controlling holder"
 GSM_UI_CSUB_TT: "Our treasury covers the company's loss every month; the +0.5% and +1% tiers also pay that share of its capital a month into its investment pool, which only pays for its investments and comes back to us when the subsidy ends. A subsidised company sheds no branches, pays no special dividend and buys back nothing. The subsidy ends by itself when we lose control or our treasury cannot cover the loss."
