 GSM_PC_SB_TT: "Click to switch the subsidy of this industry on this planet. Green / grey: your subsidy policy; yellow: your own choice for this planet.\nYou pay every branch of the industry here, foreign companies' too, while your Trade lasts: its loss after its share of overhead is covered, and 0.25% of its capital a month goes into this planet's investment pool for the industry, at most 2% of its capital a month in all. Covered branches keep their jobs, and companies invest here down to -0.3% a month. A subsidy we cannot cover in full for 3 months in a row ends."
