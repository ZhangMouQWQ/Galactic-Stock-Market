 GSM_S_GUIDE: "How the exchange works"
 GSM_S_GLOSS: "Glossary"
 GSM_GLOSSARY: "§CGCI§! Galactic Composite Index of all listed companies, dividends included (base 1000).\n§CMarket cap§! price × shares outstanding.\n§COperating value§! what the books and earnings are worth per share.\n§CMarket premium§! price / operating value - 1.\n§CNet buys§! shares the empires bought minus sold in the last 3 months.\n§CP/E§! price / yearly earnings per share.\n§CYield§! dividends of the last year / price.\n§CPublic float§! shares held by private investors; trades are filled from it.\n§CJobs filled§! share of corporate job capacity covered by workers or automation.\n§CCandles§! open, high, low and close of a month, quarter, year or 5 years (All picks by age); the letter under one marks its main event: X delisted or liquidated, N nationalised, R rescued, ST risk warning, I shares issued, B buyback, M merged, +/- rumour, D special dividend.\n§CControlling holder§! an empire holding over half the shares: it may inject capital, buy back, make offers and rename.\n§CClosure§! a branch losing money fully staffed, or half idle, for 24 months: a third sold every 6 months.\n§CJob limit§! the owner cut a branch's jobs: the units above it earn nothing and are sold after 12 months (3 at a limit of 0).\n§CWound down§! no assets and no money for one unit.\n§CRisk warning§! insolvency: at most 10 % a month, no AI buying, no public issue.\n§CDelisting§! a listed company leaves the exchange after three years under a risk warning.\n§CLiquidation§! cash and 35 % of the capital are recovered and paid out per share.\n§CDissolution§! holders of two thirds may dissolve a solvent company; 50 % of the capital is recovered."
