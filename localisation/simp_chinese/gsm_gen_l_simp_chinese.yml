 GSM_PC_T_TT: "点击：切换该行业能否在此星球新增投资。"
 GSM_PC_SB_TT: "点击：切换本星球该行业的补贴。绿色或灰色：按国策；黄色：本星球自定。\n由我们为本星球该行业的每个分部支付补贴，外国企业亦然，以国库贸易额为限：补足分部扣除管理费份额后的亏损，另按其资本每月 0.25% 注入本星球该行业的投资池，合计每月至多资本的 2%。获补贴的分部保留全部岗位；企业在此投资的门槛降至每月 −0.3%。连续三个月补不足时，补贴自动中止。"
 GSM_PC_SB_TT_HC: "点击：依次切换本星球保健的补贴：按国策、本星球自定补贴、不补贴，自定的状态显示为黄色。补贴规则与其他行业相同；仅在本星球自定补贴时，企业可超出保健上限扩张：超出部分由本星球投资池出资，运营开支由我们支付。"
