 gsm_ui.30.desc: "[Root.GetGsmPcHc]受限行业不再在此新增投资，已有企业照常运营；自由放任体制下不能按行业限制，整颗星球仍可限制。受补贴的行业：由我们补足本星球每个分部的亏损，外国企业亦然，并为本星球的行业投资池注资。仅星球所有者可改。\n\n§Y市场容量§!：每颗星球的企业岗位以其住房的一半为限。用去一半以后，新增岗位的收益逐步递减，已有岗位的平均收益也随之下降，但不会因此被出售。建设企业建造的住房可以扩大容量；容量中由它们提供的份额，其他企业按每个岗位单位每月向它们支付容量费。每家企业每季在一颗星球上新增的岗位单位，以星球的建造能力为限，余下的资金投向下一颗星球。\n\n§Y保健机构§!：一颗星球上企业经营的保健机构有其容量，随非企业建造的住房（取近一年中的最高值）与星球大小而定，至少可容两个单位。只有我们在本星球自定补贴保健（黄色）时，企业才会超出容量：多出部分的资本出自本星球投资池，运营开支由我们承担，企业不从中获利。否则超出容量的机构无利可图，每季出售其中一部分；企业总部的最后一个单位除外。"
