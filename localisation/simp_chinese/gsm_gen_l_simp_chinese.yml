 gsm_ui.3.desc: "$GSM_STATUS_LISTED$ 在交易所挂牌交易，各帝国均可买入流通股。\n$GSM_STATUS_PRIVATE$ 由母国（及民间资本）持有，不对外交易。\n$GSM_STATUS_BROOD$ / $GSM_STATUS_SUBROUTINE$ 格式塔帝国的国营实体，不进行交易。\n$GSM_STATUS_NEUTRAL$ 没有母国，各帝国均可交易，还可在“杠杆”页开设差价合约。\n$GSM_STATUS_CSUB$ 由控股股东补贴。\n$GSM_STATUS_ST$ / $GSM_STATUS_LOSS$ 资不抵债而受风险警示：满三年后，上市企业终止上市，最后几个月显示$GSM_STATUS_DELIST$；未上市的继续处于警示之下。\n$GSM_STATUS_DISTRESS$ 资不抵债，正在重组：可出售分部、接受注资或救助。\n$GSM_STATUS_RECOVERY$ 重组完成后的一年恢复期。\n$GSM_STATUS_SHELL$ 已无资产但仍有资金：必须投资，资金不足一个单位时停业。\n$GSM_STATUS_DEFUNCT$ 已停业或解散，仅保留记录。\n\n§v用排序、筛选与行业按钮缩小范围；当前匹配 [Root.gsm_ui_nres] 家。§!"
