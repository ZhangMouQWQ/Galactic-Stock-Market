 gsm_ui.8.desc: "左侧均为常规政策，也可在政策界面中修改。在此修改同样会将该政策锁定10年。\n\n§W外国资本§!：外国帝国能否购买我国企业的股票；限制时，每家企业的外资合计不超过25%。若完全开放，外国帝国可在市场上购得控股权——这是敌意收购的唯一途径。\n\n§W外资准入§!：哪些外国企业可在此开设分部；分部所得利润向我国纳税。\n\n§W海外投资§!：我国企业的海外投资：跟随投资体制；在投资体制允许的范围内，海外资本至多四分之一，国家主导体制下仍只投本国，海外地点须比本国最佳地点高出约八分之一，门槛处为每月0.08%；或完全禁止，已有海外分部保留。\n\n§W证券税§!：我国企业的外国股东就股息与收益缴纳的税。"
