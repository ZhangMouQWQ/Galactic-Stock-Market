 gsm_ui.25.desc: "[Root.GetGsmCurMissing]集团的§W控股股东§!（持股过半）可在没有成员经营的行业设立子公司，从集团现金出资，须留存£trade£1000；还可开关兜底救助与增持护盘。集团持股过半的成员，也由它控制。\n\n§W母国§!控股集团时，可让集团上市或向民间资本增发新股。\n\n持股§W三分之二§!的股东可决议解散集团：成员股份按持股以实物分给股东，现金一并派发。"
 GSM_S_GFORM: "组建控股集团"
 GSM_GF_HELP: "我们在所选企业的全部持股转入集团，集团的全部股份归我们所有。可选我国持股过半、未在重组或风险警示中的本国企业；国有化后 10 年内或被无偿征收的企业除外。"
