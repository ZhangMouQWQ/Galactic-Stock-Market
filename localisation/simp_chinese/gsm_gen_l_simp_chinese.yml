 GSM_GLOSSARY: "§C银河综合指数§! 全部上市企业，含分红，基期为1000。\n§C市值§! 股价 × 总股本。\n§C经营价值§! 按账面与盈利估算的每股价值。\n§C市场溢价§! 股价 / 经营价值 − 1。\n§C资金流向§! 近3个月各帝国净买入的股数。\n§C市盈率§! 股价 / 每股年盈利。\n§C股息率§! 近一年每股股息 / 股价。\n§C公众流通盘§! 民间投资者所持股份，买卖均与之成交。\n§C在岗率§! 企业岗位中由人工或自动化覆盖的比例。\n§CK线§! 每月、每季、每年或每5年的开盘、最高、最低、收盘价，“全部”按成立时长选择周期。下方标记当期要事：退 退市或清算、国 收归国有、救 救助、ST 风险警示、发 增发或注资、购 回购、并 吸收合并、利/空 传闻、息 特别股息。\n§C控股股东§! 持股过半的帝国，可以注资、回购、收购与改名。\n§C关停§! 满员仍亏损或长期闲置的分部，24个月后每6个月出售三分之一；此后两年在此投资该行业的门槛更高。\n§C限岗§! 星球所有者调低了分部的岗位限制：超出的单位不计收入，12个月后出售，上限为0时3个月后出售；限制解除后可再投资。“限制投资”只停新投资。\n§C停业§! 企业已无资产，资金也不足一个单位。\n§C风险警示§! 资不抵债，或现金低于债券且近一年亏损的企业：单月涨跌不超过10%，AI不买入，不能公开增发。\n§C终止上市§! 风险警示满三年的上市企业退出交易所，股东照常获得股息。\n§C解散清算§! 收回现金及35%的资本，按持股派发。\n§C决议解散§! 持股三分之二的股东可以解散有偿付能力的企业，回收资本的50%。"
