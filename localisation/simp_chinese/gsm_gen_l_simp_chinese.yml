 GSM_S_REGNOTE_1: "监管说明"
 gsm_ui.5.desc: "左侧均为常规政策，也可在政策界面中修改。在此修改同样会将该政策锁定10年，新殖民地政策除外，在此可随时更改。\n\n§W企业税§!：企业每月以£trade£贸易额缴纳的经营利润比例。\n\n§W投资体制§!：企业利润如何在再投资与分红间分配，以及投向何处：国家主导只投本国，引导兼投海外但海外资本不超过一半，自由放任放眼全银河。\n\n§W企业救助§!：企业资不抵债、进入重组时如何救助；选择个案处理时，每起都会呈报我们定夺。\n\n§W企业补贴§!：我国各星球的默认设置，可在星球企业窗口逐颗星球另行设置。国库负担得起时，我们为受补贴行业在该星球的每个分部补足扣除管理费份额后的亏损，外国企业亦然；另按分部资本每月0.25%注入该星球的行业投资池，在此新增投资时由池支付至多一半。两者合计每月至多资本的2%。这些分部保留全部岗位，企业即使预计小幅亏损也会在此投资。\n\n§W国防外包§!：舰队更弱但更便宜；军事承包与安保服务企业只在实行期间存在，取消时立即解散。\n\n§W反垄断§!：两家本国企业合并后，在我国该行业中可达到的最大份额。\n\n§W投资节奏§!：审慎投资下，企业只在新增岗位的维护费不超过我国该资源的月收入加上库存的二十四分之一时才在我国星球增设岗位；自由投资则不顾及我国收支。已在运营的企业不会因此缩减。\n\n§W新殖民地§!：只适用于此后建成的殖民地，已有殖民地不变：起初对企业开放，还是所有行业均为“已限制”，再在星球企业窗口中逐个开放。自由放任体制下，限制不起作用。在此更改不会锁定；在政策界面中更改则照常进入冷却。"
