 gsm_ui.7.desc: "§H银河证券交易所§!\n\n星海之中，财富不只出自矿井与工厂，也源于信心与预期。银河证券交易所让各帝国的企业公开募资、同台竞逐，也让精明的投资者从中获利。\n\n§Y企业§!由帝国在“企业管理 → 成立新企业”中创办。每家企业属于一个行业，拥有一颗总部星球和一个母国，即总部所在的帝国。帝国可经营的企业数量随£pop£人口增长。AI 帝国优先成立科研企业，其次是供给科研的行业，从不成立政治咨询企业。\n\n§Y企业分部§!列在星球“地产”栏的“银河证券交易所”一行：每个在此经营的行业占一座建筑，承载企业开设的£job£岗位；建设企业则建造£housing£住房。通过该栏的“企业”按钮或星球决议，可以查看星球上的全部企业；星球所有者还能在那里限制个别行业继续投资，但自由放任体制下不可用；“新殖民地的企业投资”政策决定此后新建的殖民地是否一开始就限制全部行业。岗位的具体形式由星球所有者决定。企业的收入取决于这些岗位的在岗人数及其在当地的价值：£amenities£舒适度与£housing£住房越紧缺越值钱，统治者岗位则在劳动力供需平衡时最值钱。某类岗位在星球上仍有空缺时，企业不会再为其增设岗位。\n\n§Y财务§!每月结算。收入 = 在岗岗位 × 产出，按市场价格折算为£trade£贸易额；£unity£凝聚力、科研、舒适度与住房则按固定的影子价格计算。保健企业促成的人口增长与组装，按每个人口的固定价格计价。空闲住房达到人口的十分之一时，这部分收益全额计入；住房越紧张，收益越低；住房不足时转为亏损。成本包括岗位维护费、运营费、折旧与管理费，母国另以贸易额征收企业税。每家企业的应税利润先扣除一笔总部免税额；新成立的企业头两年还免缴母国企业税。企业每季度先以贸易额派发常规股息，再投资一轮：\n— 已有分部的扩建与新地点按税后回报统一排序，择优投资。回报依据星球的实际岗位产出估算，建筑、科技、传统与精炼建筑的附带产出均计入其中。每颗星球每季至多新增若干单位，余下的资金沿名单投向下一颗星球，直到没有值得投资的地点。回报表覆盖本国每一颗殖民地；\n— 已有分部的在岗率须不低于§Y85%§!，每轮至多扩大一倍；\n— 季度投资之后，现金超出储备、资本的15%、债务、近一年投资额与再投资资金的部分，半数作为特别分红派发，以可分配利润为限。出售分部所得留作再投资资金，两年内优先用于投资。\n投资范围取决于母国的投资体制：国家主导只投本国；引导也投海外，但海外资本不超过一半，且海外地点的回报须比本国最佳地点高出约八分之一，门槛处为每月§Y0.08%§!；自由放任则放眼全银河。“海外投资”政策还可在投资体制允许的范围内，把海外资本限制在企业资本的四分之一以内，或禁止对外投资。“海外”指“外资准入”政策允许进入的帝国，即政策为开放，或为仅限商业协议伙伴且双方签有协议，前提是两国已建立联络并保持和平。海外利润向东道国纳税；东道国与母国交战期间，这些分部颗粒无收。\n\n§Y市场容量§!：每颗星球的企业岗位以其住房的一半为限。用去一半以后，新增岗位的收益逐步递减，已有岗位的平均收益也随之下降，但已有岗位不会因此被出售。建设企业建造的住房可以扩大容量；容量中由它们提供的份额，其他企业按每个岗位单位每月向它们支付容量费。星球的住房超过人口的两倍时，建设企业的租金收益开始下降，超过三倍即转为亏损；容量费照常全额计入。每家企业每季在一颗星球上新增的岗位单位，以星球的建造能力为限，余下的资金投向下一颗星球。星球企业窗口显示各星球的容量、容量费与上限。\n\n§Y股价§!以经营价值为基础，即按账面价值与盈利估算的价值，再乘以市场因子：市场情绪、行业景气、企业风险、企业自身的消息、近三个月的资金流向与近半年的走势，其中企业风险来自战争、重组与总部被占。市场因子限定在0.4至2.5倍之间，且各项都会回归常态，因此长期来看，股价由经营决定。股价逐步变动，略有噪声，并随牛熊周期起伏。\n\n§Y交易§!按股数下单：在企业页右侧的下单面板选择买入或卖出及股数，面板会显示最多可买或可卖的股数、预估成交价、金额与手续费。交易对手是公众流通盘，每笔成交都会推动价格，并收取§Y1%§!手续费。外国买入受企业母国的“外国资本”政策约束。也可改为限价委托：每月结算时按收盘价撮合，买单在收盘价不高于限价、卖单在收盘价不低于限价时成交，委托至多保留12个月，每个帝国至多5笔。\n\n§Y中立企业§!包括银河探索公司、银河期货交易所、星际军工联合体、银河保险集团、星尘量子与饺子的发射平台。它们没有母国，股价随银河局势（扩张、交易、战争）或纯粹的炒作起落，规模每年随全银河各帝国的财富增长。在它们的“杠杆”页可按股数交易差价合约：买入做多，卖出做空，每家企业只有一个净仓位；杠杆为2、5或10倍，饺子的发射平台最高30倍，仓位至多为市值的两倍；保证金为名义价值除以杠杆倍数，从贸易额中扣除。另收手续费与每月资金费；每月结算时，多头按当月最低价、空头按最高价估值，权益跌破保证金的四分之一即强制平仓，亏损以保证金为限。自行平仓时，只成交结算款放得下贸易额储存的部分；强制平仓超出储存上限的部分记为待入账款项，逐月入账。企业总市值以1000亿为限，股价触顶时企业页标注［股价已达上限］。\n\n§Y国防外包§!是格式塔帝国不可用的政策：造舰时间§R+50%§!，舰船维护费§G-20%§!，舰队指挥上限与海军容量§R-50%§!，舰船与陆军经验获得§R-50%§!。实行期间可成立军事承包（士兵）与安保服务（执法者）企业，一旦取消政策，它们将立即解散。\n\n§Y公司行动§!：控股股东（持股过半）可以注资、回购，也可以让企业吸收合并同行业的企业；母国同时控股时还可增发新股，未上市企业首次增发即上市。持股三分之二的股东可以决议解散有偿付能力的企业。母国可以将企业收归国有，国有化后十年内仍可决议解散，但只能按清算价回收。亏损不会使企业停业：只有没有任何资产、现金与投资池又不够投资一个单位时，企业才停业清算。没有资产但资金足够的企业处于§Y休眠§!，必须投资。资不抵债的企业进入§R重组§!：不分红、不发债，只投回报有把握的地点；可以出售分部、被同业收购、由股东注资，或获得国库救助、民间纾困与债转股，按“企业救助”政策处置，个案处理时逐一呈报我们定夺。扭亏后经一年恢复期回到正常，但不会被清算。资不抵债的企业还将被实施§R风险警示§!：单月涨跌不超过10%；三年后上市企业终止上市，未上市则继续处于风险警示之下。蜂巢意识经营分巢，机械智能经营子程序，二者始终国营、不上市。交易所名册至多200席，企业与控股集团各占一席。成立企业时，可在确认页从名称库中挑选名称，或借用首都的名字输入任意名称；母国或持股过半的帝国可在企业页点击“改名”为其更名。\n\n§Y企业补贴§!：控股股东可在企业的“公司行动”页为企业开启补贴，由其国库每月补足企业的亏损，还可另付资本的0.5%或1%进入企业的投资池，这笔钱只能用于投资。受补贴的企业不缩减分部，也不会进入重组，但不发特别分红、不回购；国库不足或控股权易手时补贴中止，投资池的余额退还付款人。“企业补贴”政策决定我国各星球默认补贴哪些行业：星球所有者先补足这些行业分部的亏损，其余进入该星球的行业投资池，供在此投资的企业取用。受星球补贴的行业同样不缩减分部；所有者连续三个月付不足时自动中止。星球所有者的岗位上限照旧适用。同时享有两种补贴的企业在该星球扩张更快。\n\n§Y控股集团§!：非格式塔帝国可在“企业管理 → 组建集团”中，把至少两家持股过半的本国企业组建为控股集团，每个帝国至多一个。我们在成员中的持股转入集团，换取集团的全部股份。集团的控股股东可动用集团现金设立子公司，并开关兜底救助与增持护盘；集团持股过半的成员也由它控制。详见集团页。\n\n§YK线§!显示每月、每季或每年的开盘价、最高价、最低价与收盘价，分别保留20个月、20个季度与20年的历史；“全部”按成立时长自动选择周期，最长每根5年。\n\n§Y合作帝国§!：同一帝国的所有玩家共用这个终端。有人翻页时，其他人也会跟着切换。不想被打扰的话，请在“消息设置 → 经济”里把“金融终端窗口”的弹出关掉——终端只会留在通知栏，需要时点开即可；关闭窗口时请用窗口右上角的关闭按钮（那是系统自带的“忽略”，忽略后这一轮后续页面不会再打扰你）。"
