 GSM_HOLD_OPEN_COMPANIES_TT: "查看在此星球经营的企业；星球所有者可在那里限制各行业的投资。"
 decision_gsm_planet_companies: "企业与投资"
 decision_gsm_planet_companies_desc: "查看在此经营的企业，设定各行业的投资与补贴。"
 decision_gsm_planet_companies_effect: "打开本星球的企业窗口。"
 gsm_trade_vault: "证券账户"
 mod_country_resource_max_trade_add: "贸易额储存上限"
 gsm_trade_vault_desc: "银河证券交易所为我们开设了清算账户：£trade£贸易额储存上限提高到10亿。"
 policy_gsm_policy_defense_outsourcing: "国防外包"
 policy_gsm_policy_defense_outsourcing_desc: "国防是国家的职责，还是可以购买的服务？私营承包商要价低廉，但他们效忠的是合同，而不是帝国。\n\n由私营承包商提供士兵与执法者：舰队更弱但更便宜；实行期间可以成立军事承包与安保服务企业。"
 gsm_dout_off: "自主国防"
 gsm_dout_off_name: "$gsm_dout_off$"
 gsm_dout_off_desc: "保卫帝国的武装力量，必须只听命于帝国。\n\n不得成立军事承包与安保服务企业。"
 gsm_dout_on: "国防外包"
 gsm_dout_on_name: "$gsm_dout_on$"
 gsm_dout_on_desc: "让专业人士去打仗，我们只管付账。\n\n造舰时间§R+50%§!，舰船维护费§G-20%§!，舰队指挥上限与海军容量§R-50%§!，舰船与陆军经验获得§R-50%§!。可以成立军事承包与安保服务企业；取消政策时它们立即解散。"
 GSM_DOUT_GESTALT: "格式塔帝国不可用"
 policy_gsm_policy_securities_tax: "证券税"
 policy_gsm_policy_securities_tax_desc: "从我国企业获利的外国资本，理应留下一部分。\n\n我国企业的外国股东须缴纳股息预提税；卖出股份，或在清算、收归国有时获得偿付，须就收益缴税。国家自身的持股与本国民间投资者免征。"
 gsm_stx_none: "免征"
 gsm_stx_none_name: "$gsm_stx_none$"
 gsm_stx_none_desc: "资本应当自由流动；我们向企业征税，而不是向它的主人。\n\n不征收证券税。"
 gsm_stx_std: "标准"
 gsm_stx_std_name: "$gsm_stx_std$"
 gsm_stx_std_desc: "从我国经济中获利者，理应分担其维系之责。\n\n外国股东：股息预提税§Y10%§!，收益税§Y10%§!。"
 gsm_stx_high: "高"
 gsm_stx_high_name: "$gsm_stx_high$"
 gsm_stx_high_desc: "我们的财富不该被外人轻易带走。\n\n外国股东：股息预提税§Y25%§!，收益税§Y20%§!。"
 policy_gsm_policy_outward_fdi: "海外投资"
 policy_gsm_policy_outward_fdi_desc: "流出的资本，建设的是别国。\n\n决定我国企业可在何处海外投资。再投资比例仍由投资体制决定。"
 gsm_ofdi_regime: "跟随投资体制"
 gsm_ofdi_regime_name: "$gsm_ofdi_regime$"
 gsm_ofdi_regime_desc: "资本流向何处，由我们的投资体制决定。\n\n国家主导：只投本国；引导：海外资本至多一半；自由放任：不限。"
 gsm_ofdi_limited: "限制"
 gsm_ofdi_limited_name: "$gsm_ofdi_limited$"
 gsm_ofdi_limited_desc: "资本可以走出去，但大部分须留在国内。\n\n在投资体制允许的范围内，海外资本至多占企业资本的§Y25%§!：国家主导体制下仍只投本国，海外地点的税后回报须比本国最佳地点高出约八分之一，门槛处为每月§Y0.08%§!。"
 gsm_ofdi_forbidden: "禁止"
 gsm_ofdi_forbidden_name: "$gsm_ofdi_forbidden$"
 gsm_ofdi_forbidden_desc: "我们的资本为我们的人民服务。\n\n企业只在本国投资；已有的海外分部保留。"
 policy_gsm_policy_antitrust: "反垄断"
 policy_gsm_policy_antitrust_desc: "任何企业都不应将一个市场攥在手心。\n\n决定两家本国企业合并后，在我国该行业中所能达到的最大份额。"
 gsm_at_standard: "标准"
 gsm_at_standard_name: "$gsm_at_standard$"
 gsm_at_standard_desc: "集中须受监督，而非禁止。\n\n合并后份额至多§Y50%§!。"
 gsm_at_lax: "宽松"
 gsm_at_lax_name: "$gsm_at_lax$"
 gsm_at_lax_desc: "龙头企业方能打赢战争。\n\n合并后份额至多§Y70%§!。"
 gsm_at_strict: "严格"
 gsm_at_strict_name: "$gsm_at_strict$"
 gsm_at_strict_desc: "卖家越多，价格越公道。\n\n合并后份额至多§Y35%§!。"
 policy_gsm_policy_invest_pace: "企业投资节奏"
 policy_gsm_policy_invest_pace_desc: "财富若超出国库的承受，终将酿成赤字。\n\n决定企业在我国星球上增设岗位的节奏：其维护费是否须控制在我国的资源月收入与适度动用的库存之内。"
 gsm_ip_prudent: "审慎投资"
 gsm_ip_prudent_name: "$gsm_ip_prudent$"
 gsm_ip_prudent_desc: "企业新增岗位前，须确认其维护费不超过我国该资源的月收入加上库存的二十四分之一；超出部分推迟投资。"
 gsm_ip_free: "自由投资"
 gsm_ip_free_name: "$gsm_ip_free$"
 gsm_ip_free_desc: "企业按资金与劳动力自由扩张，不顾及国家的资源收支。"
 policy_gsm_policy_new_colony_invest: "新殖民地的企业投资"
 policy_gsm_policy_new_colony_invest_desc: "新殖民地尚未立起第一座工厂时，最便于引导。\n\n只适用于此后建成的殖民地，已有殖民地不变。选择限制时，其各行业起初均为“已限制”，直到在星球企业窗口中逐个开放；自由放任下不起作用。在金融终端监管页更改没有冷却，在此更改照常冷却。"
 gsm_nci_open: "开放投资"
 gsm_nci_open_name: "$gsm_nci_open$"
 gsm_nci_open_desc: "此后建成的殖民地上，所有行业起初均为“开放”。已有殖民地不受影响。"
 gsm_nci_restrict: "限制投资"
 gsm_nci_restrict_name: "$gsm_nci_restrict$"
 gsm_nci_restrict_desc: "此后建成的殖民地上，所有行业起初均为“已限制”：企业不在此新增投资，直到我们在星球企业窗口逐个开放。已有殖民地不受影响。"
 gsm_review.1.name: "外国投资项目"
 gsm_review.1.desc: "外国企业§Y[From.GetRealName]§!申请在[FromFrom.GetName]投资，新增§W[Root.gsm_d_fp_u]§!个岗位单位的产能。这些岗位将服务于我们的星球，在此取得的利润向我国缴纳企业税，但资本听命于另一个国家。\n\n若我们在 30 天内未提出异议，项目将照常推进。"
 gsm_review.1.a: "准许投资"
 gsm_review.1.b: "驳回申请（该企业 5 年内不再在此提出）"
 GSM_NEWS_MSG_15: "§Y[event_target:gsm_news_1.GetRealName]§! 已解散：其母国未实行国防外包。"
 GSM_NEWS_MSG_16: "§Y[event_target:gsm_news_1.GetRealName]§! 资不抵债，被实施§Y风险警示§!并标注 ST。若三年内未能扭转，将终止上市。"
 GSM_NEWS_MSG_17: "§Y[event_target:gsm_news_1.GetRealName]§! 风险警示满三年仍未扭转，已终止上市。持股人照常分红，但股份已无处卖出，只有母国还能买入。"
 GSM_NEWS_MSG_18: "§Y[event_target:gsm_news_1.GetRealName]§! 经股东决议解散，资产有序变卖后已分配给股东。"
 GSM_NEWS_MSG_20: "§Y[event_target:gsm_news_1.GetName]§!受到星海共同体经济制裁：其企业的风险上升，未受制裁的共同体成员不得买入其股票，其企业也不得在成员国新开分部。"
 gsm_merger.1.name: "收购要约"
 gsm_merger.1.desc: "§Y[FromFrom.GetRealName]§!提出以每股 £trade£§W[From.gsm_d_off_ps]§! 吸收合并由我们控股的§Y[From.GetRealName]§!。若我们接受，其现金、盈利与收购方可经营的分部将并入收购方，其余分部按资本的一半出售，股东获得现金或收购方的股份。接受时重新核价，低于此价则要约作废；其间若有分红，此价按除息比例下调。要约将于 30 天后失效。"
 gsm_merger.1.a: "接受要约"
 gsm_merger.1.b: "拒绝"
 GSM_NEWS_MSG_21: "§Y[event_target:gsm_news_1.GetRealName]§!被同业吸收合并：现金与可经营的分部并入收购方，股东获得现金或收购方的股份。"
 GSM_NEWS_MSG_22: "§Y[event_target:gsm_news_1.GetRealName]§!分拆成立：原企业在一国的分部组成新企业，由原企业的股东按持股比例持有。"
 GSM_NEWS_MSG_19: "§Y[event_target:gsm_news_1.GetRealName]§!从公众流通盘回购股份并注销，余下的每股所占份额随之提高。"
 GSM_NEWS_MSG_23: "§Y[event_target:gsm_news_1.GetRealName]§!组建为控股集团：组建帝国所持的成员企业股份转入集团，换取集团的全部股份。"
 GSM_NEWS_MSG_24: "§Y[event_target:gsm_news_1.GetRealName]§!由所属集团出资设立，全部股份归集团所有。"
 GSM_NEWS_MSG_25: "§Y[event_target:gsm_news_1.GetRealName]§!资不抵债、进入重组，所属集团出资纾困，换取新发行的股份。"
 GSM_NEWS_MSG_26: "§Y[event_target:gsm_news_1.GetRealName]§!解散：所持成员股份按持股比例分给股东，现金一并派发。"
 GSM_NEWS_MSG_27: "§Y[event_target:gsm_news_1.GetRealName]§!总部所在殖民地失守，又无其他据点可迁，已解散清算，剩余资产已分配给股东。"
 GSM_NEWS_MSG_28: "§Y[event_target:gsm_news_1.GetRealName]§! 获得控股股东的补贴：其亏损每月由后者的国库补足。补贴期间，该企业不缩减分部、不发特别分红、不回购股份。"
 GSM_NEWS_MSG_29: "§Y[event_target:gsm_news_1.GetRealName]§! 的补贴已中止：控股股东停止补贴、失去控股或国库已无力补足亏损。投资池的余额已退还付款方。"
 GSM_NEWS_MSG_30: "§Y[event_target:gsm_news_1.GetRealName]§! 资不抵债，进入重组：停止分红，不再举债，只做有把握的投资，可以出售分部、增资或债转股，母国将决定是否救助。"
 GSM_NEWS_MSG_31: "§Y[event_target:gsm_news_1.GetRealName]§! 完成重组。恢复期一年内派息减半，不发新债。"
 GSM_TERMINAL_ENTRY: "金融终端"
 gsm_market_sit: "银河综指 [event_target:gsm_exchange.gsm_d_index] [This.GetGsmSitChg1m]"
 gsm_market_sit_type: "银河综指"
 gsm_market_sit_desc: "银河证券交易所全体上市证券的综合指数，基期1000，含股息。\n\n近1月 [This.GetGsmSitChg1m] · 近1年 [This.GetGsmSitChg12m]\n市场情绪 §W[event_target:gsm_exchange.gsm_d_sent]%§! · [This.GetGsmSitRegime]\n\n进度条即市场情绪，每月结算后更新：低于94%为低迷，高于106%为高涨。选择“打开金融终端”即可调阅行情。取消法令“关注证券行情”即可移除此条目。"
 gsm_market_sit_monthly_change_tooltip: "进度即市场情绪，由交易所每月结算时确定。"
 gsm_market_sit_end_tt: "市场情绪始终介于60%与150%之间。"
 gsm_sit_st_low: "情绪低迷"
 gsm_sit_st_low_desc: "市场情绪低于94%：投资者普遍悲观，股价承压。"
 gsm_sit_st_mid: "情绪平稳"
 gsm_sit_st_mid_desc: "市场情绪介于94%与106%之间。"
 gsm_sit_st_high: "情绪高涨"
 gsm_sit_st_high_desc: "市场情绪高于106%：投资者普遍乐观，股价受到提振。"
 gsm_sit_ap_watch: "观望"
 gsm_sit_ap_watch_desc: "静观市场起落。"
 gsm_sit_ap_watch_tt: "不采取任何行动。"
 gsm_sit_ap_term: "打开金融终端"
 gsm_sit_ap_term_desc: "调阅银河证券交易所的金融终端：行情、投资组合、企业名录、企业管理与监管。"
 gsm_sit_ap_term_tt: "打开金融终端，随后恢复为§Y观望§!。"
