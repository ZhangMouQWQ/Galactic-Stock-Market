 decision_gsm_open_terminal: "打开金融终端"
 decision_gsm_open_terminal_desc: "调阅银河证券交易所的金融终端：行情、投资组合、企业名录、企业管理与监管。"
 decision_gsm_encourage_investment: "鼓励企业投资"
 decision_gsm_encourage_investment_desc: "我们向企业界释放明确的信号：这颗星球欢迎资本。\n\n企业在选择投资地点时会优先考虑这颗星球。"
 decision_gsm_encourage_investment_effect: "企业优先在本星球投资。"
 decision_gsm_restrict_investment: "限制企业投资"
 decision_gsm_restrict_investment_desc: "这颗星球不再欢迎新的企业资本。\n\n企业不能在本星球新设或扩建分部，已有分部照常经营。"
 decision_gsm_restrict_investment_effect: "企业不能再在本星球投资。"
 decision_gsm_neutral_investment: "取消企业投资规定"
 decision_gsm_neutral_investment_desc: "撤销对这颗星球的一切投资指导，由企业自行判断。"
 decision_gsm_neutral_investment_effect: "移除本星球的投资规定。"
 policy_gsm_policy_corporate_tax: "企业税制"
 policy_gsm_policy_corporate_tax_desc: "企业依托帝国的秩序与市场获利，国家理应从中分得一份。税率太低，国库空虚；税率太高，资本便会裹足不前。\n\n企业每月以£trade£贸易额缴纳经营利润的一定比例。"
 gsm_tax_standard: "标准企业税"
 gsm_tax_standard_name: "$gsm_tax_standard$"
 gsm_tax_standard_desc: "国家与资本各取所需，相安无事。\n\n企业缴纳经营利润的§Y20%§!。"
 gsm_tax_low: "低企业税"
 gsm_tax_low_name: "$gsm_tax_low$"
 gsm_tax_low_desc: "轻徭薄赋，藏富于企，投资者自会以信心相报。\n\n企业缴纳经营利润的§Y10%§!。税后利润更高，股价也更有支撑。"
 gsm_tax_high: "高企业税"
 gsm_tax_high_name: "$gsm_tax_high$"
 gsm_tax_high_desc: "企业的财富建立在帝国的基础设施与和平之上，理应为此付出更多。\n\n企业缴纳经营利润的§Y35%§!。"
 policy_gsm_policy_foreign_capital: "外国资本"
 policy_gsm_policy_foreign_capital_desc: "外资带来资金与信心，也可能让我们的企业落入他人之手。我们必须决定，资本市场要向外开放到何种程度。\n\n决定外国帝国能否购买我国企业的股票。"
 gsm_fc_restricted: "限制外资"
 gsm_fc_restricted_name: "$gsm_fc_restricted$"
 gsm_fc_restricted_desc: "欢迎外国资本，但企业的控制权必须留在国内。\n\n外国投资者对每家本国企业的持股合计不超过§Y25%§!。"
 gsm_fc_open: "开放资本市场"
 gsm_fc_open_name: "$gsm_fc_open$"
 gsm_fc_open_desc: "资本没有国界：谁出价最高，谁就能拥有。\n\n外国投资者可以不限量购买我国上市企业的股票。持股过半的外国帝国成为控股股东，可以注资与回购；持股达到三分之二时，还可以决议解散该企业。"
 gsm_fc_closed: "封闭资本市场"
 gsm_fc_closed_name: "$gsm_fc_closed$"
 gsm_fc_closed_desc: "我们的企业属于我们的人民，外国人无权染指。\n\n外国投资者不能购买我国企业的股票。"
 policy_gsm_policy_investment_regime: "企业投资体制"
 policy_gsm_policy_investment_regime_desc: "利润是留作扩张，还是分给股东？是在本国深耕，还是放眼银河？投资体制决定了资本的去向。\n\n决定企业如何在再投资与分红之间分配利润，以及在哪里投资。"
 gsm_ir_guided: "引导投资"
 gsm_ir_guided_name: "$gsm_ir_guided$"
 gsm_ir_guided_desc: "国家为资本指明方向，但不越俎代庖。\n\n企业以闲置现金的§Y60%§!再投资，以利润的§Y40%§!分红。本国与海外均可投资：海外资本不超过资本的一半，海外地点的税后回报须比本国最佳地点高出约八分之一，门槛处为每月§Y0.08%§!。"
 gsm_ir_laissez_faire: "自由放任"
 gsm_ir_laissez_faire_name: "$gsm_ir_laissez_faire$"
 gsm_ir_laissez_faire_desc: "市场自会为资本找到最好的去处，国家无需插手。\n\n企业以闲置现金的§Y80%§!再投资，以利润的§Y50%§!分红。放眼全银河，本国与海外地点只比税后回报。我们不能在本国星球上限制特定行业的投资。"
 gsm_ir_directed: "国家主导投资"
 gsm_ir_directed_name: "$gsm_ir_directed$"
 gsm_ir_directed_desc: "资本应当服务于国家的宏图大业，而不是股东的钱袋。\n\n企业以利润的§Y25%§!分红，以闲置现金的§Y70%§!再投资，且只在本国投资。"
 policy_gsm_policy_bailout: "企业救助"
 policy_gsm_policy_bailout_desc: "当一家企业濒临破产，国家是伸出援手，还是任由市场出清？每一次救助，既考验国库，也考验市场的纪律。\n\n决定本国企业资不抵债、进入重组时国家如何应对。"
 gsm_bo_case_by_case: "个案处理"
 gsm_bo_case_by_case_name: "$gsm_bo_case_by_case$"
 gsm_bo_case_by_case_desc: "救急不救穷：值得挽救的，我们才挽救。\n\n每家进入重组的企业都会呈报我们定夺：出手救助、收归国有、纾困融资或债转股。此后每年再呈报一次，也可随时在企业页呈报处置。"
 gsm_bo_never: "不予救助"
 gsm_bo_never_name: "$gsm_bo_never$"
 gsm_bo_never_desc: "市场的纪律不容破坏，国库不为失败买单。\n\n进入重组的企业得不到国库救助与纾困融资，只能自救：出售分部、由股东或所属集团注资、债转股，或被同业收购。"
 gsm_bo_always: "大而不倒"
 gsm_bo_always_name: "$gsm_bo_always$"
 gsm_bo_always_desc: "有些企业太大，大到不能倒。\n\n进入重组的企业都会得到救助：国库充裕时由国库出资，否则由民间资本纾困融资。获救的企业十年内不再获得这两种救助。"
 policy_gsm_policy_subsidies: "企业补贴"
 policy_gsm_policy_subsidies_desc: "有些行业关乎民生，却难以盈利。国家是否应当为它们兜底？\n\n决定我国各星球默认补贴哪些行业。只要国库负担得起，受补贴行业在我国星球上的每个分部，包括外国企业的分部，都由国库补足扣除管理费份额后的亏损，并保留全部岗位；另按分部资本每月0.25%注入该星球的行业投资池，供在此新增投资。各星球可在其企业窗口中另行设置。"
 gsm_sub_none: "不补贴"
 gsm_sub_none_name: "$gsm_sub_none$"
 gsm_sub_none_desc: "企业必须自负盈亏，国库不是慈善机构。\n\n资不抵债的企业进入重组，只能自救或等待救助。"
 gsm_sub_public: "公共服务"
 gsm_sub_public_name: "$gsm_sub_public$"
 gsm_sub_public_desc: "传媒、保健与住房是社会的基石，不能任其凋零。\n\n只要国库负担得起，我国星球上的媒体、保健、建设分部，以及实行国防外包时的军事承包与安保服务分部，亏损都由国库补足，并保留全部岗位；另按其资本每月0.25%注入该星球的行业投资池。各星球可另行设置。"
 gsm_sub_all: "全部行业"
 gsm_sub_all_name: "$gsm_sub_all$"
 gsm_sub_all_desc: "我们星球上的每一个岗位都是国家的财富，没有一个可以空缺。\n\n只要国库负担得起，我国星球上所有行业的分部，亏损都由国库补足，并保留全部岗位；另按其资本每月0.25%注入该星球的行业投资池。各星球可另行设置。"
 policy_gsm_policy_fdi: "外资准入"
 policy_gsm_policy_fdi_desc: "外国企业带来资本与岗位，也会把利润汇回母国。我们欢迎谁来我们的星球投资？\n\n决定哪些外国企业可以在我国设立分部。收紧准入只会停止新的投资，原有分部予以保留。"
 gsm_fdi_pact: "仅限商业协议伙伴"
 gsm_fdi_pact_name: "$gsm_fdi_pact$"
 gsm_fdi_pact_desc: "只与值得信赖的伙伴做生意。\n\n与我国签有商业协议的帝国，其企业可以在我国投资。"
 gsm_fdi_open: "开放"
 gsm_fdi_open_name: "$gsm_fdi_open$"
 gsm_fdi_open_desc: "我们的星球向全银河的资本敞开大门。\n\n凡与我国建立联络且保持和平的帝国，其企业都可以在我国投资。"
 gsm_fdi_forbidden: "禁止"
 gsm_fdi_forbidden_name: "$gsm_fdi_forbidden$"
 gsm_fdi_forbidden_desc: "我们的星球只为我们自己的企业服务。\n\n外国企业不能在我国新建分部。"
 GSM_FDI_GESTALT: "格式塔帝国不适用"
 gsm_company.50.name: "财务危机：[From.GetRealName]"
 gsm_company.50.desc: "财政部急报：§Y[From.GetRealName]§! 已资不抵债，进入重组。\n\n现金：£trade£[From.gsm_d_cash]　资本：£trade£[From.gsm_d_k]　股价：£trade£[From.gsm_d_price]\n\n救助需耗资 £trade£[From.gsm_d_bail]，作为回报，我们将以折价认购其新发行的股份。若折价将其收归国有并注资，则需 £trade£[From.gsm_d_natcost]，外加救助费用。若我们暂不出手，企业将自行重组：出售分部，只做有把握的投资；一年后此事将再度呈报。"
 gsm_company.50.a: "出手救助"
 gsm_company.50.a.tooltip: "偿清其债务并注入缓冲资金。我们以市价的一半认购新股，但不低于每股经营价值的 90%，现有股东的股份将被稀释。"
 gsm_company.50.b: "收归国有"
 gsm_company.50.b.tooltip: "以市价的§Y30%§!收购其他股东的全部股份，再为企业注资。"
 gsm_company.50.e: "纾困融资"
 gsm_company.50.e.tooltip: "由我国民间资本池出资 £trade£[From.gsm_d_bail]，按市价的一半（不低于每股经营价值的 90%）认购新股，国库分文不出。新股归国内储户所有，现有股东（包括我们）的股份将被大幅稀释。"
 gsm_company.50.f: "债转股"
 gsm_company.50.f.tooltip: "我国民间资本借给它的债券折价换成新股，归国内储户所有。国库分文不出，企业卸下这笔债务，现有股东的股份将被稀释。"
 gsm_company.50.d: "容后再议"
 gsm_company.50.d.tooltip: "暂不处理。企业仍在重组中，一年后此事将再度呈报；也可随时在企业页呈报处置。"
