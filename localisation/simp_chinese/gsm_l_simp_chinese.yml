 edict_gsm_market_watch: "关注证券行情"
 edict_gsm_market_watch_desc: "责成财政部门每月呈报银河证券交易所的行情，在总览的局势栏中常驻银河综指与市场情绪。"
 gsm_market_watch_tt: "总览的§Y局势§!中显示§Y银河综指§!与市场情绪，点选条目打开局势日志，再选择“打开金融终端”即可调阅终端。取消此法令即移除该条目。"
